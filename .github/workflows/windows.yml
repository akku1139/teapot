# Windows verification (#110 item 4).
#
# The operator asked for a real Windows runner — NOT Wine. Wine hides exactly the
# things that break here: process-group kills, `HOME` being unset, and which
# shell a command lands in.
#
# ## Why this does not run `pnpm test`
#
# The suite shells out extensively — 28 of 116 files need a POSIX shell, POSIX
# paths, or POSIX permissions — so the whole suite would fail on Windows for a
# KNOWN reason and bury anything real. `pnpm test` stays the Linux gate.
#
# The split is made mechanically: `test/helpers/posix-only.ts` gates on
# `process.platform`, so a test opts OUT with one greppable line rather than
# becoming invisible through a filename pattern.
#
# ## Why there is no typecheck here (#113)
#
# `test.yml` runs typecheck + typecheck-web + lint + build on every push and
# every PR, and tsc is cross-platform — so repeating it on a second runner costs
# minutes and finds nothing. This workflow is only the part that genuinely needs
# Windows: `pnpm build` (vite writing a bundle there) and the tests.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # #113: pnpm/setup installs pnpm AND Node in one step, reading both from
      # package.json (packageManager: pnpm@11.3.0, engines.node: >=24). That
      # replaces pnpm/action-setup + actions/setup-node — and, unlike
      # setup-node's `cache: pnpm`, it cannot fall out of step with the lockfile.
      - uses: actions/checkout@v7

      # #113: pnpm/setup installs pnpm AND Node in one step, reading pnpm from
      # `packageManager`. Node must be pinned EXPLICITLY: the action falls back to
      # `devEngines.runtime`, then a version file, then `lts` — and this repo has
      # none of the first two, so omitting `runtime` would silently build the
      # release on whatever LTS happens to be, rather than the node >=24 that
      # package.json's `engines` requires.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24

      - run: pnpm install --frozen-lockfile

      # The bundle tests read public/assets/, so the bundle must exist here. The
      # first run failed three of them with "no built web bundle".
      - run: pnpm build

      # Named individually so a failure points at the file rather than a list.
      # These two carry the platform-independent half of the Windows work.
      - name: windows-specific tests
        run: >
          pnpm exec node --test
          test/windows-tilde-expansion.test.ts
          test/kill-tree-windows.test.ts

      - name: platform-independent tests
        run: pnpm run test:portable

      # #110: the bug that started this was a `~` directory. Assert the real
      # invariant on the real platform rather than trusting a unit test: with HOME
      # unset, homeDir() must still find a home, and no directory literally named
      # `~` may appear.
      #
      # #110: this step contains NO literal backslash. Backslash-escaping has
      # caused three separate false failures here — `.Replace('\\','/')` matched a
      # literal DOUBLE backslash and produced
      # "file:///D:aeapoteapot/src/home.ts" — and each one failed before reaching
      # its own assertions, so every run blamed the product for a workflow bug.
      # `$bs = [char]92` builds the separator without a literal, so no layer
      # between the YAML and PowerShell can mangle it.
      - name: home directory resolves without HOME (#110)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bs = [char]92
          # HOME is normally UNSET on a Windows runner; remove it either way,
          # since that is the exact condition the bug needed.
          Remove-Item Env:HOME -ErrorAction SilentlyContinue

          $repo = ([System.Uri]("$env:GITHUB_WORKSPACE/")).AbsoluteUri.TrimEnd('/')
          $homeDir = node --input-type=module -e "import {homeDir} from '$repo/src/home.ts'; process.stdout.write(String(homeDir()));"
          # A probe fault must not be reported as a product fault.
          if ($LASTEXITCODE -ne 0) {
            Write-Error "probe could not run (node exit $LASTEXITCODE) - WORKFLOW fault, not product"
            exit 1
          }
          Write-Host "homeDir() with HOME unset -> '$homeDir'"

          if ([string]::IsNullOrEmpty($homeDir)) {
            Write-Error "FAIL: homeDir returned nothing (#110)"
            exit 1
          }
          $segments = $homeDir.Split(@($bs, '/'), [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($segments -contains '~') {
            Write-Error "FAIL: homeDir resolved to a literal ~ ('$homeDir') (#110)"
            exit 1
          }

          # …and the symptom itself, in a scratch directory.
          $probe = Join-Path $env:RUNNER_TEMP 'tilde-probe'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          Push-Location $probe
          try {
            if (Test-Path '~') {
              Write-Error "FAIL: a directory literally named ~ was created (#110)"
              exit 1
            }
            Write-Host "OK: no literal ~ directory (cwd=$(Get-Location))"
          } finally {
            Pop-Location
          }