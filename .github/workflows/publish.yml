# Publish teapot-coding-agent to npm.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret is stored in the
# repository. One-time setup on npmjs.com:
#   package → Settings → Trusted Publisher →
#     repository: akku1139/teapot
#     workflow:   .github/workflows/publish.yml
#
# Release flow:
#   1. bump "version" in package.json
#   2. git tag vX.Y.Z && git push origin vX.Y.Z  (or run manually via workflow_dispatch)

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: required for trusted publishing + provenance attestation
      # Optional hardening: restrict to a protected GitHub environment.
      # environment: npm
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_V="v$(node -p "require('./package.json').version")"
          if [ "$PKG_V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_V}"
            exit 1
          fi

      # #113: pnpm/setup installs pnpm AND Node in one step, reading pnpm from
      # `packageManager`. Node must be pinned EXPLICITLY: the action falls back to
      # `devEngines.runtime`, then a version file, then `lts` — and this repo has
      # none of the first two, so omitting `runtime` would silently build the
      # release on whatever LTS happens to be, rather than the node >=24 that
      # package.json's `engines` requires.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # runners ship an npm that may predate OIDC trusted publishing support
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      # #113: `actions/setup-node` is kept HERE even though the other workflows
      # moved to `pnpm/setup`. Its `registry-url` + `always-auth` are what make
      # trusted publishing work: without that .npmrc,
      #
      #     npm error code ENEEDAUTH
      #     npm error need auth This command requires you to be logged in to
      #                         https://registry.npmjs.org/
      #
      # Setting the registry by hand was NOT enough — the run still failed with
      # the identical error, so it is not just the registry value but the auth
      # wiring setup-node installs alongside it. Rather than reconstruct that by
      # hand and guess at which part npm consults, this workflow keeps the action
      # that is known to work and pins Node to the same major.
      #
      # The Node-20 deprecation warning stays on this one workflow until the OIDC
      # path is verified; a warning is better than a release that cannot ship.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish --provenance --access public
