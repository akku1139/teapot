# Run the test suite (and a build to catch type/bundle errors) on every push
# to main and every pull request, so regressions surface before release.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # #113: pnpm/setup installs pnpm AND Node in one step, reading pnpm from
      # `packageManager`. Node must be pinned EXPLICITLY: the action falls back to
      # `devEngines.runtime`, then a version file, then `lts` — and this repo has
      # none of the first two, so omitting `runtime` would silently build the
      # release on whatever LTS happens to be, rather than the node >=24 that
      # package.json's `engines` requires.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24

      - run: pnpm install --frozen-lockfile

      # typecheck both sides explicitly (the frontend has its own tsconfig —
      # vite/esbuild transpiles TSX without checking, so undefined identifiers
      # would otherwise only explode at render time in the browser)
      - run: pnpm typecheck
      - run: pnpm typecheck-web
      - run: pnpm lint

      - run: pnpm build # tsc + vite: catches type and bundling breakage

      - run: pnpm test
